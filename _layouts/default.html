<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <!-- Google Fonts: Orbitron (headings) + Share Tech (body) + Fira Code (mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <div class="neon-progress" id="neon-progress" role="progressbar" aria-hidden="true"></div>

  <div class="neon-wrap">
    <nav class="neon-nav" role="navigation" aria-label="Main navigation">
      <div class="neon-nav__inner">
        <a href="{{ '/' | relative_url }}" class="neon-nav__logo">
          {{ site.title | split: ' ' | first }}<span>{{ site.title | split: ' ' | last }}</span>
        </a>
        <button class="neon-nav__toggle" aria-expanded="false" aria-controls="neon-nav-links" aria-label="Toggle navigation">☰</button>
        <ul class="neon-nav__links" id="neon-nav-links">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/archive' | relative_url }}">Archive</a></li>
          <li><a href="{{ '/tags' | relative_url }}">Tags</a></li>
          <li><a href="{{ '/about' | relative_url }}">About</a></li>
        </ul>
      </div>
    </nav>

    <main class="neon-main" id="main-content">
      {{ content }}
    </main>

    <footer class="neon-footer">
      <div class="container">
        <p class="neon-footer__text">
          &copy; {{ site.time | date: "%Y" }}
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
          &nbsp;//&nbsp; Built with
          <a href="https://github.com/csswitch/jekyll-neon-theme">Neon Noir</a>
          by <a href="https://github.com/csswitch">csswitch</a>
        </p>
      </div>
    </footer>
  </div>

  <script src="{{ '/assets/js/neon.js' | relative_url }}"></script>

  <!-- csswitch attribution — licensed users may remove this block: https://csswitch.gumroad.com -->
  <div class="csswitch-attr" style="text-align:center;padding:6px 0 12px;font-size:11px;opacity:0.45;font-family:sans-serif;">
    <a href="https://csswitch.github.io" rel="noopener" style="color:inherit;text-decoration:none;">Theme by csswitch</a>
    &middot;
    <a href="https://csswitch.gumroad.com" rel="noopener" style="color:inherit;text-decoration:none;">Remove attribution →</a>
  </div>
</body>
</html>
